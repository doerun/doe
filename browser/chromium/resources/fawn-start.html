html { min-height: 100%; }
body {

}
body::before {

button, input { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #c4f9d8; outline-offset: 4px; }
a { color: inherit; }
#gpu-overlay { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
.page { position: relative; z-index: 2; max-width: 1480px; min-height: 100vh; margin: auto; padding: 30px clamp(24px, 5vw, 84px) 16px; display: flex; flex-direction: column; }
.masthead, .brand, .live, .metrics-head, .section-head, .demo-top, .demo-bottom { display: flex; align-items: center; justify-content: space-between; }

.brand { gap: 12px; text-decoration: none; font-size: 21px; font-weight: 750; letter-spacing: -.06em; }
.brand-mark { width: 23px; height: 23px; border: 2px solid #bdeed2; border-radius: 5px 12px 5px 12px; transform: rotate(-21deg); box-shadow: 0 0 24px rgba(133, 253, 185, .36), inset 0 0 12px rgba(133, 253, 185, .22); }
.brand span:last-child { padding-bottom: 2px; }
.live { gap: 10px; color: #b4c6b9; font-size: 11px; font-weight: 650; letter-spacing: .17em; text-transform: uppercase; }
.dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: #9bf3b4; box-shadow: 0 0 13px #88eaae; }
.live .dot { animation: breathe 2.8s ease-in-out infinite; }
@keyframes breathe { 50% { opacity: .45; box-shadow: 0 0 4px #88eaae; } }
.hero { position: relative; flex: 1; min-height: 455px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .95fr); align-items: center; gap: 2vw; }
.hero-copy { position: relative; z-index: 3; padding: 60px 0; }

.eyebrow { margin: 0 0 25px; }

.hero-caption { margin: 28px 0 33px; color: #b5c9b8; font-size: clamp(16px, 1.6vw, 20px); letter-spacing: -.015em; }
.search { display: flex; align-items: center; gap: 12px; width: min(100%, 490px); padding: 7px 7px 7px 20px; border: 1px solid rgba(213, 243, 219, .27); border-radius: 18px; background: rgba(12, 27, 22, .79); box-shadow: 0 18px 60px rgba(0, 0, 0, .19), inset 0 1px rgba(255, 255, 255, .06); backdrop-filter: blur(20px); }

.search-icon { width: 17px; height: 17px; flex: none; border: 1.8px solid #abc8b4; border-radius: 50%; position: relative; }

.search input { min-width: 0; flex: 1; border: 0; outline: 0; color: #f5fbf3; background: transparent; font-size: 15px; }
.search input::placeholder { color: #a1b4a6; }
.search button { width: 43px; height: 43px; flex: none; border: 0; border-radius: 12px; color: #10251a; background: #b9ecc3; cursor: pointer; font-size: 23px; transition: transform .2s, background .2s; }
.search button:hover { transform: translateX(2px); background: #e1ffe5; }
.hero-art { position: relative; display: grid; place-items: center; min-height: 455px; align-self: stretch; pointer-events: none; }
.hero-art::before { content: ""; position: absolute; width: min(41vw, 540px); aspect-ratio: 1; border: 1px solid rgba(197, 249, 218, .28); border-radius: 50%; box-shadow: 0 0 0 38px rgba(173, 242, 198, .025), 0 0 0 90px rgba(173, 242, 198, .025), inset 0 0 110px rgba(83, 210, 139, .11), 0 0 125px rgba(88, 195, 147, .18); background: radial-gradient(circle at 56% 45%, rgba(166, 235, 172, .12), rgba(31, 78, 59, .06) 43%, transparent 70%); }

.logo { width: min(30vw, 390px); height: auto; z-index: 1; fill: #d9f3dc; opacity: .89; filter: drop-shadow(0 0 42px rgba(144, 248, 171, .31)); transform: translateY(-4%); }
.orbit-label { position: absolute; bottom: 9%; right: 2%; color: #afc9b7; font: 11px/1.5 "SF Mono", Menlo, monospace; letter-spacing: .12em; text-transform: uppercase; }
.showcase { position: relative; z-index: 2; padding-bottom: 4px; }
.section-head { margin-bottom: 16px; }
.section-head span:last-child { color: #829989; letter-spacing: .12em; }
.demo-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.demo-link { position: relative; min-height: 174px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 17px 21px 20px; border: 1px solid rgba(190, 240, 204, .2); border-radius: 20px; text-decoration: none; background: #13251e; isolation: isolate; transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease; }

.demo-link::before { content: ""; position: absolute; inset: 0; z-index: -2; }
.demo-link::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(4, 14, 12, .8), transparent 70%); }
.prismatic::before { background: radial-gradient(ellipse at 73% 37%, #bfe5cc 0, #689997 12%, #623d64 22%, #103f4c 38%, transparent 65%), radial-gradient(ellipse at 40% 100%, #bd7373, transparent 61%), #101e2a; }
.particles::before { background: radial-gradient(circle at 68% 50%, #fff0c6 0 2px, transparent 4px), radial-gradient(circle at 44% 29%, #e8ad8e 0 2px, transparent 5px), radial-gradient(circle at 85% 26%, #d7f5d1 0 3px, transparent 5px), radial-gradient(ellipse at 62% 65%, #7e944c, #284847 35%, #0b201f 70%); }
.image-lab::before { background: linear-gradient(90deg, transparent 49.5%, rgba(233, 255, 233, .85) 50%, transparent 50.5%), radial-gradient(circle at 72% 42%, #f7e1a5 0 7%, #dd947f 13%, transparent 33%), linear-gradient(138deg, #242e56 0%, #745174 48%, #223e4a 49%, #15262c 100%); }
.demo-top { color: #d5e6d9; font: 12px "SF Mono", Menlo, monospace; }

.demo-bottom strong { font-size: clamp(20px, 2.1vw, 30px); font-weight: 650; letter-spacing: -.045em; }
.demo-bottom small { color: #d8e9dc; font-size: 10px; font-weight: 700; letter-spacing: .16em; }

.metrics-head { gap: 8px; color: #a6c3ae; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; }
.status-row { display: flex; align-items: center; gap: 7px; min-width: 0; }
.status-row span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.metrics-value { margin: 16px 0 4px; color: #effff0; font-size: 34px; line-height: 1; letter-spacing: -.065em; }
.metrics-value small { color: #9ac7a4; font-size: 12px; letter-spacing: 0; }
.frame-info, .gpu-info { color: #a4b9aa; font-size: 10px; line-height: 1.5; }
.fps-graph { display: block; width: 100%; height: 43px; margin: 10px 0 8px; border-radius: 7px; }

document.getElementById('search-form').addEventListener('submit', function(event) {
  event.preventDefault();
  var value = document.getElementById('search-input').value.trim();
  if (!value) return;
  var address = /^(https?:\/\/)/i.test(value) ? value : /^(localhost|127\.0\.0\.1)(?::\d+)?(?:\/|$)/i.test(value) ? 'http://' + value : 'https://' + value;
  var looksLikeAddress = !/\s/.test(value) && (/^https?:\/\//i.test(value) || /^localhost(?::\d+)?(?:\/|$)/i.test(value) || /^[\w-]+(?:\.[\w-]+)+(?::\d+)?(?:\/|$)/.test(value));
  if (looksLikeAddress) {
    try {
      var parsed = new URL(address);
      if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
        location.href = parsed.href;
        return;
      }
    } catch (_) {}
  }
  location.href = 'https://www.google.com/search?q=' + encodeURIComponent(value);
});

const WGSL_OVERLAY = `
struct Params {
  resolution: vec2<f32>,
  time: f32,
  phase: f32,
  c0: vec4<f32>,
  c1: vec4<f32>,
  c2: vec4<f32>,
  c3: vec4<f32>,
}

@group(0) @binding(0) var<uniform> u: Params;

fn hash(p: vec2<f32>) -> f32 {
  var n = fract(vec3<f32>(p.x, p.y, p.x) * vec3<f32>(0.1031, 0.1030, 0.0973));
  n = n + dot(n, vec3<f32>(n.y + 33.33, n.z + 33.33, n.x + 33.33));
  return fract((n.x + n.y) * n.z);
}

fn gmod(a: vec2<f32>, b: vec2<f32>) -> vec2<f32> {
  return a - b * floor(a / b);
}

fn hexSDF(p: vec2<f32>) -> f32 {
  let q = abs(p);
  return max(dot(q, vec2<f32>(0.866025, 0.5)), q.y) - 0.5;
}

struct HexCell { id: vec2<f32>, local: vec2<f32>, }

fn hexGrid(uv: vec2<f32>, scale: f32) -> HexCell {
  let p = uv * scale;
  let s = vec2<f32>(1.0, 1.7320508);
  let h = s * 0.5;
  let a = gmod(p, s) - h;
  let b = gmod(p - h, s) - h;
  if (dot(a, a) < dot(b, b)) {
    return HexCell(floor(p / s), a);
  }
  return HexCell(floor((p - h) / s), b);
}

struct FlipResult {
  scaleX: f32,
  scaleY: f32,
  tiltX: f32,
  tiltY: f32,
  glow: f32,
}

fn calcFlip(click: vec4<f32>, center: vec2<f32>, aspect: f32) -> FlipResult {
  if (click.w < 0.5) { return FlipResult(1.0, 1.0, 0.0, 0.0, 0.0); }
  let origin = vec2<f32>((click.x - 0.5) * aspect, click.y - 0.5);
  let delta = center - origin;
  let dist = length(delta);
  var dir = vec2<f32>(0.0, 1.0);
  if (dist > 0.0001) { dir = delta / dist; }
  let t = click.z;
  let waveFront = t * 0.44;
  let band = smoothstep(0.24, 0.0, abs(dist - waveFront));
  let rise = smoothstep(0.0, 0.10, t);
  let decay = 1.0 - smoothstep(0.35, 2.35, t);
  let distanceFade = 1.0 - smoothstep(0.18, 1.55, waveFront + dist * 0.65);
  let pulse = band * rise * decay * distanceFade;
  let tiltX = dir.y * pulse * 1.05;
  let tiltY = -dir.x * pulse * 1.05;
  let scaleX = 1.0 - abs(tiltY) * 0.28;
  let scaleY = 1.0 - abs(tiltX) * 0.28;
  let glow = pulse * (0.28 + 0.72 * smoothstep(0.20, 0.0, abs(dist - waveFront)));
  return FlipResult(scaleX, scaleY, tiltX, tiltY, glow);
}

@vertex
fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
  let x = f32(i32(i & 1u)) * 4.0 - 1.0;
  let y = f32(i32(i >> 1u)) * 4.0 - 1.0;
  return vec4<f32>(x, y, 0.0, 1.0);
}

@fragment
fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let uv = fc.xy / u.resolution;
  let asp = u.resolution.x / u.resolution.y;
  let co = vec2<f32>((uv.x - 0.5) * asp, uv.y - 0.5);

  let gridScale = 12.0;
  let cell = hexGrid(co, gridScale);
  let id = cell.id;
  var g = cell.local;
  let cellCenter = co - cell.local / gridScale;

  let r1 = hash(id);
  let r2 = hash(id + vec2<f32>(71.0, 137.0));
  let r3 = hash(id + vec2<f32>(213.0, 47.0));

  let f0 = calcFlip(u.c0, cellCenter, asp);
  let f1 = calcFlip(u.c1, cellCenter, asp);
  let f2 = calcFlip(u.c2, cellCenter, asp);
  let f3 = calcFlip(u.c3, cellCenter, asp);
  let totalScaleX = f0.scaleX * f1.scaleX * f2.scaleX * f3.scaleX;
  let totalScaleY = f0.scaleY * f1.scaleY * f2.scaleY * f3.scaleY;
  let totalTiltX = clamp(f0.tiltX + f1.tiltX + f2.tiltX + f3.tiltX, -1.0, 1.0);
  let totalTiltY = clamp(f0.tiltY + f1.tiltY + f2.tiltY + f3.tiltY, -1.0, 1.0);
  let waveGlow = max(max(f0.glow, f1.glow), max(f2.glow, f3.glow));

  g = vec2<f32>(g.x * totalScaleX, g.y * totalScaleY);

  // Smooth radius noise — organic wobble instead of perfect hexagons
  let angle = atan2(g.y, g.x);
  let wobble = sin(angle * 3.0 + r1 * 6.28) * 0.02
             + sin(angle * 5.0 + r2 * 6.28) * 0.015
             + sin(angle * 7.0 + r3 * 6.28) * 0.008;
  let d = hexSDF(g) + wobble;
  let cl = length(g);

  // Ambient boundary shimmer so the lattice reads faintly at rest
  let edgeBand = smoothstep(0.095, 0.0, abs(d));
  let ambientWave = 0.5 + 0.5 * sin(u.time * (0.42 + r1 * 0.34) + r2 * 6.28);
  let edgeGlow = edgeBand * (0.36 + ambientWave * 0.22 + waveGlow * 0.24);
  let edgeCol = mix(
    vec3<f32>(0.22, 0.64, 0.39),
    mix(vec3<f32>(0.24, 0.72, 0.46), vec3<f32>(0.72, 0.92, 0.80), vec3<f32>(waveGlow)),
    vec3<f32>(r1)
  );

  // Cell interior stays faintly present, then brightens along the wave
  let fillBase = smoothstep(0.03, -0.25, d) * 0.13;
  let fill = fillBase + waveGlow * 0.08;
  let fillCol = mix(
    mix(vec3<f32>(0.05, 0.13, 0.07), vec3<f32>(0.14, 0.28, 0.18), vec3<f32>(waveGlow)),
    mix(vec3<f32>(0.07, 0.18, 0.10), vec3<f32>(0.20, 0.36, 0.24), vec3<f32>(waveGlow)),
    vec3<f32>(r1)
  );

  let waveCol = mix(
    vec3<f32>(0.70, 0.64, 0.38),
    vec3<f32>(0.92, 0.93, 0.78),
    vec3<f32>(waveGlow)
  );

  // Firefly sparkle — very slow, smooth
  let st = u.time * (0.057 + r1 * 0.12) + r1 * 6.283;
  let sparkle = pow(max(sin(st), 0.0), 3.0) * step(0.65, r2);
  let sparkleCol = mix(
    vec3<f32>(0.90, 0.72, 0.28),
    vec3<f32>(0.45, 0.82, 0.48),
    vec3<f32>(r1 * 0.6)
  );
  let sr = smoothstep(0.22, 0.0, cl);

  // Two-axis lighting makes the ripple read like a softer x/y flip
  let tiltShade = 1.0 + g.y * totalTiltX * 1.25 + g.x * totalTiltY * 1.25;
  let specular = pow(max(0.0, 1.0 - abs(d) * 5.5), 3.0) * (abs(totalTiltX) + abs(totalTiltY)) * 0.22;

  // Compose
  var col = fillCol * fill;
  col = col + edgeCol * edgeGlow * 0.56;
  col = col + sparkleCol * sparkle * sr * 0.8;
  col = col + waveCol * waveGlow * 0.16;
  col = col + vec3<f32>(0.96, 0.94, 0.84) * specular;
  col = col * tiltShade;

  let localPhase = u.phase + waveGlow * (1.0 - u.phase);
  let a = (edgeGlow * 0.56 + fill * 0.46 + sparkle * sr * 0.8 + waveGlow * 0.12 + specular * 0.7) * localPhase;
  return vec4<f32>(col * a, a);
}
`;

(async () => {
  const dot = document.getElementById('gpu-dot');
  const liveDot = document.getElementById('live-dot');
  const liveLabel = document.getElementById('live-label');
  const status = document.getElementById('gpu-status');
  const backendInfo = document.getElementById('gpu-backend');
  const info = document.getElementById('gpu-info');
  const frame = document.getElementById('frame');
  const fpsValue = document.getElementById('fps-value');
  const fpsGraph = document.getElementById('fps-graph');
  const fpsGraphCtx = fpsGraph.getContext('2d');
  const overlay = document.getElementById('gpu-overlay');

  var device = null, pipeline = null, uniformBuf = null, bindGroup = null, gpuCtx = null;
  var pageStart = performance.now() * 0.001;
  var lastFrameMs = performance.now();
  var clicks = [];
  var MAX_CLICKS = 4;
  var AMBIENT = 0.45;
  var fpsHistory = [];
  var smoothedMs = 16.7;
  var lastPointerTrailMs = 0;
  var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var running = true;

  function resizeGraphCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var width = Math.max(1, Math.floor(fpsGraph.clientWidth * dpr));
    var height = Math.max(1, Math.floor(fpsGraph.clientHeight * dpr));
    if (fpsGraph.width === width && fpsGraph.height === height) return;
    fpsGraph.width = width;
    fpsGraph.height = height;
  }

  function drawFpsGraph() {
    resizeGraphCanvas();
    var width = fpsGraph.width;
    var height = fpsGraph.height;
    fpsGraphCtx.clearRect(0, 0, width, height);
    fpsGraphCtx.fillStyle = 'rgba(10, 18, 14, 0.88)';
    fpsGraphCtx.fillRect(0, 0, width, height);
    if (fpsHistory.length < 2) return;

    var minFps = Math.max(0, Math.min.apply(null, fpsHistory) * 0.96);
    var maxFps = Math.max(minFps + 1, Math.max.apply(null, fpsHistory) * 1.04);
    var range = maxFps - minFps;

    fpsGraphCtx.beginPath();
    for (var i = 0; i < fpsHistory.length; i++) {
      var x = fpsHistory.length === 1 ? 0 : (i / (fpsHistory.length - 1)) * width;
      var y = height - 1 - ((fpsHistory[i] - minFps) / range) * Math.max(1, height - 2);
      if (i === 0) {
        fpsGraphCtx.moveTo(x, y);
      } else {
        fpsGraphCtx.lineTo(x, y);
      }
    }
    fpsGraphCtx.lineJoin = 'round';
    fpsGraphCtx.lineCap = 'round';
    fpsGraphCtx.lineWidth = Math.max(1.5, (window.devicePixelRatio || 1) * 1.1);
    fpsGraphCtx.strokeStyle = '#a9dbc0';
    fpsGraphCtx.stroke();
  }

  function recordFrameSample(dtMs) {
    fpsHistory.push(1000 / Math.max(dtMs, 0.001));
    if (fpsHistory.length > 120) fpsHistory.shift();
    drawFpsGraph();
  }

  try {
    if (!navigator.gpu) throw new Error('WebGPU not available');
    var adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('No adapter');
    device = await adapter.requestDevice();
    device.lost.then(function(reason) {
      running = false;
      dot.style.background = '#ff9477';
      liveDot.style.background = '#ff9477';
      liveDot.style.boxShadow = '0 0 13px #ff9477';
      liveLabel.textContent = 'WebGPU lost';
      status.textContent = 'WebGPU device lost';
      info.textContent = reason.message || 'Reload to reconnect';
    });

    var ai = adapter.info || {};
    dot.style.background = '#4a9';
    liveLabel.textContent = 'WebGPU active';
    status.textContent = 'WebGPU active';
    backendInfo.textContent = 'runtime: not exposed';
    var parts = [];
    if (ai.vendor) parts.push(ai.vendor);
    if (ai.architecture) parts.push(ai.architecture);
    if (ai.device) parts.push(ai.device);
    if (device.limits.maxBufferSize) parts.push('maxBuffer: ' + (device.limits.maxBufferSize / (1024*1024*1024)).toFixed(1) + ' GB');
    info.textContent = parts.join(' \u00b7 ');

    var format = navigator.gpu.getPreferredCanvasFormat();
    var dpr = window.devicePixelRatio || 1;
    overlay.width = window.innerWidth * dpr;
    overlay.height = window.innerHeight * dpr;
    gpuCtx = overlay.getContext('webgpu');
    gpuCtx.configure({ device, format, alphaMode: 'premultiplied' });

    var module = device.createShaderModule({ code: WGSL_OVERLAY });
    uniformBuf = device.createBuffer({
      size: 80,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    pipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module, entryPoint: 'vs' },
      fragment: { module, entryPoint: 'fs', targets: [{ format }] },
      primitive: { topology: 'triangle-list' },
    });
    bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: uniformBuf } }],
    });
    drawFpsGraph();

    function addPulse(e) {
      if (e.target.closest('a, button, input')) return;
      var rect = overlay.getBoundingClientRect();
      var x = rect.width > 0 ? (e.clientX - rect.left) / rect.width : 0.5;
      var y = rect.height > 0 ? (e.clientY - rect.top) / rect.height : 0.5;
      clicks.push({
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
        t: performance.now() * 0.001
      });
      if (clicks.length > MAX_CLICKS) clicks.shift();
    }
    document.body.addEventListener('pointerdown', addPulse);
    document.body.addEventListener('pointermove', function(e) {
      if (reducedMotion || e.pointerType === 'touch') return;
      var now = performance.now();
      if (now - lastPointerTrailMs < 95) return;
      lastPointerTrailMs = now;
      addPulse(e);
    });

    requestAnimationFrame(renderFrame);

  } catch (e) {
    dot.style.background = '#a33';
    liveDot.style.background = '#ff9477';
    liveDot.style.boxShadow = '0 0 13px #ff9477';
    liveLabel.textContent = 'WebGPU unavailable';
    status.textContent = 'WebGPU: ' + e.message;
    backendInfo.textContent = 'runtime: unavailable';
    return;
  }

  function renderFrame() {
    if (!running || document.hidden) {
      if (running) requestAnimationFrame(renderFrame);
      return;
    }
    try {
      renderActiveFrame();
    } catch (error) {
      running = false;
      dot.style.background = '#ff9477';
      liveDot.style.background = '#ff9477';
      liveDot.style.boxShadow = '0 0 13px #ff9477';
      liveLabel.textContent = 'WebGPU error';
      status.textContent = 'WebGPU error';
      info.textContent = error.message || String(error);
    }
  }

  function renderActiveFrame() {
    var nowMs = performance.now();
    var dtMs = Math.min(64, nowMs - lastFrameMs);
    lastFrameMs = nowMs;
    var dpr = window.devicePixelRatio || 1;
    var w = window.innerWidth * dpr;
    var h = window.innerHeight * dpr;
    if (overlay.width !== w || overlay.height !== h) {
      overlay.width = w;
      overlay.height = h;
      gpuCtx.configure({ device, format, alphaMode: 'premultiplied' });
    }

    var now = nowMs * 0.001;
    var elapsed = reducedMotion ? 0 : now - pageStart;
    var phase = AMBIENT;

    // Expire old clicks (brightness boost is local, handled in shader)
    var alive = [];
    for (var i = 0; i < clicks.length; i++) {
      if (now - clicks[i].t < 8.0) alive.push(clicks[i]);
    }
    clicks = alive;

    // Pack uniforms: resolution(2) + time(1) + phase(1) + 4 click slots(4*4=16) = 20 floats = 80 bytes
    var data = new Float32Array(20);
    data[0] = overlay.width;
    data[1] = overlay.height;
    data[2] = elapsed;
    data[3] = phase;
    // c0..c3 at offsets 4,8,12,16 — each is (x, y, elapsed_since_click, active)
    for (var i = 0; i < 4; i++) {
      var base = 4 + i * 4;
      if (i < clicks.length) {
        data[base]     = clicks[i].x;
        data[base + 1] = clicks[i].y;
        data[base + 2] = now - clicks[i].t;
        data[base + 3] = 1.0;
      } else {
        data[base + 3] = 0.0;
      }
    }
    device.queue.writeBuffer(uniformBuf, 0, data);

    var encoder = device.createCommandEncoder();
    var pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: gpuCtx.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 0 },
        loadOp: 'clear',
        storeOp: 'store',
      }],
    });
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.draw(3);
    pass.end();
    device.queue.submit([encoder.finish()]);
    smoothedMs = smoothedMs * 0.9 + dtMs * 0.1;
    frame.textContent = smoothedMs.toFixed(1) + ' ms / frame';
    fpsValue.textContent = Math.round(1000 / Math.max(smoothedMs, 0.001));
    liveLabel.textContent = 'WebGPU · ' + fpsValue.textContent + ' FPS';
    recordFrameSample(smoothedMs);
    requestAnimationFrame(renderFrame);
  }
})();
</script>
</body>
</html>
