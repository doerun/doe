  let w = i32(u.grid.x);
  let h = i32(u.grid.y);
  let cx = clamp(x, 0, w - 1);
  let cy = clamp(y, 0, h - 1);
  return u32(cy * w + cx);
}

fn uv_to_grid(uv: vec2<f32>) -> vec2<f32> {
  return uv * u.grid.xy - vec2<f32>(0.5, 0.5);
}

fn safe_norm(v: vec2<f32>) -> vec2<f32> {
  return v / max(length(v), 1e-5);
}

`;

const ADVECT_VEL_WGSL = `
${SHARED_HELPERS}
@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> velSrc: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> velDst: array<vec4<f32>>;

fn sample_vel(uv: vec2<f32>) -> vec2<f32> {
  let gridPos = uv_to_grid(clamp(uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let base = floor(gridPos);
  let frac = gridPos - base;
  let x0 = i32(base.x);
  let y0 = i32(base.y);
  let x1 = x0 + 1;
  let y1 = y0 + 1;
  let v00 = velSrc[idx_at(x0, y0)].xy;
  let v10 = velSrc[idx_at(x1, y0)].xy;
  let v01 = velSrc[idx_at(x0, y1)].xy;
  let v11 = velSrc[idx_at(x1, y1)].xy;
  let vx0 = mix(v00, v10, frac.x);
  let vx1 = mix(v01, v11, frac.x);
  return mix(vx0, vx1, frac.y);
}

@compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let width = u32(u.grid.x);
  let height = u32(u.grid.y);
  if (gid.x >= width || gid.y >= height) {
    return;
  }

  let uv = (vec2<f32>(gid.xy) + 0.5) * u.grid.zw;
  let currentVel = sample_vel(uv);
  let prevUv = clamp(uv - currentVel * u.sim.x, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5);
  var vel = sample_vel(prevUv) * 0.989;

  let delta = uv - u.mouse.xy;
  let dist = length(delta);
  let falloff = smoothstep(u.mouse.w, 0.0, dist) * u.mouse.z;
  let drag = u.pointerDelta.xy;
  let dragLen = max(length(drag), 1e-5);
  let dragDir = drag / dragLen;
  let swirl = vec2<f32>(-delta.y, delta.x);
  let swirlLen = max(length(swirl), 1e-5);
  vel += (dragDir * dragLen * 1.55 + (swirl / swirlLen) * 0.08) * falloff * u.sim.x;

  if (gid.x <= 1u || gid.y <= 1u || gid.x >= width - 2u || gid.y >= height - 2u) {
    vel *= 0.0;
  }
  velDst[idx_at(i32(gid.x), i32(gid.y))] = vec4<f32>(vel, 0.0, 0.0);
}
`;

const DIV_CURL_WGSL = `
${SHARED_HELPERS}
@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> velSrc: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read_write> divCurl: array<vec4<f32>>;

fn vel_at(x: i32, y: i32) -> vec2<f32> {
  return velSrc[idx_at(x, y)].xy;
}

@compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let width = u32(u.grid.x);
  let height = u32(u.grid.y);
  if (gid.x >= width || gid.y >= height) {
    return;
  }

  let x = i32(gid.x);
  let y = i32(gid.y);
  let l = vel_at(x - 1, y);
  let r = vel_at(x + 1, y);
  let b = vel_at(x, y - 1);
  let t = vel_at(x, y + 1);

  let div = 0.5 * ((r.x - l.x) / u.grid.z + (t.y - b.y) / u.grid.w);
  let curl = 0.5 * ((r.y - l.y) / u.grid.z - (t.x - b.x) / u.grid.w);
  divCurl[idx_at(x, y)] = vec4<f32>(div, curl, abs(curl), 0.0);
}
`;

const PRESSURE_WGSL = `
${SHARED_HELPERS}
@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> pressureSrc: array<f32>;
@group(0) @binding(2) var<storage, read> divCurl: array<vec4<f32>>;
@group(0) @binding(3) var<storage, read_write> pressureDst: array<f32>;

fn pressure_at(x: i32, y: i32) -> f32 {
  return pressureSrc[idx_at(x, y)];
}

@compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let width = u32(u.grid.x);
  let height = u32(u.grid.y);
  if (gid.x >= width || gid.y >= height) {
    return;
  }
  let x = i32(gid.x);
  let y = i32(gid.y);
  let div = divCurl[idx_at(x, y)].x;
  let l = pressure_at(x - 1, y);
  let r = pressure_at(x + 1, y);
  let b = pressure_at(x, y - 1);
  let t = pressure_at(x, y + 1);
  let p = (l + r + b + t - div * 0.85) * 0.25;
  pressureDst[idx_at(x, y)] = p;
}
`;

const PROJECT_WGSL = `
${SHARED_HELPERS}
@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> velSrc: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read> pressure: array<f32>;
@group(0) @binding(3) var<storage, read> divCurl: array<vec4<f32>>;
@group(0) @binding(4) var<storage, read_write> velDst: array<vec4<f32>>;

fn pressure_at(x: i32, y: i32) -> f32 {
  return pressure[idx_at(x, y)];
}

fn curl_at(x: i32, y: i32) -> f32 {
  return divCurl[idx_at(x, y)].y;
}

@compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let width = u32(u.grid.x);
  let height = u32(u.grid.y);
  if (gid.x >= width || gid.y >= height) {
    return;
  }

  let x = i32(gid.x);
  let y = i32(gid.y);
  let i = idx_at(x, y);
  var vel = velSrc[i].xy;
  let grad = vec2<f32>(
    pressure_at(x + 1, y) - pressure_at(x - 1, y),
    pressure_at(x, y + 1) - pressure_at(x, y - 1)
  ) * 0.5;
  vel -= grad * vec2<f32>(u.grid.z, u.grid.w);

  let curl = curl_at(x, y);
  let gradCurl = vec2<f32>(
    abs(curl_at(x + 1, y)) - abs(curl_at(x - 1, y)),
    abs(curl_at(x, y + 1)) - abs(curl_at(x, y - 1))
  );
  let curlLen = max(length(gradCurl), 1e-5);
  let n = gradCurl / curlLen;
  let vorticity = vec2<f32>(n.y, -n.x) * curl * u.sim.z * u.sim.x * 0.026;
  vel += vorticity;

  if (gid.x <= 1u || gid.y <= 1u || gid.x >= width - 2u || gid.y >= height - 2u) {
    vel *= 0.0;
  }
  velDst[i] = vec4<f32>(vel, 0.0, 0.0);
}
`;

const ADVECT_DYE_WGSL = `
${SHARED_HELPERS}
@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> dyeSrc: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read> velSrc: array<vec4<f32>>;
@group(0) @binding(3) var<storage, read_write> dyeDst: array<vec4<f32>>;

fn sample_vel(uv: vec2<f32>) -> vec2<f32> {

  let v10 = velSrc[idx_at(x1, y0)].xy;
  let v01 = velSrc[idx_at(x0, y1)].xy;
  let v11 = velSrc[idx_at(x1, y1)].xy;
  let vx0 = mix(v00, v10, frac.x);
  let vx1 = mix(v01, v11, frac.x);

fn sample_dye(uv: vec2<f32>) -> vec3<f32> {
  let gridPos = uv_to_grid(clamp(uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let base = floor(gridPos);
  let frac = gridPos - base;
  let x0 = i32(base.x);
  let y0 = i32(base.y);
  let x1 = x0 + 1;
  let y1 = y0 + 1;
  let d00 = dyeSrc[idx_at(x0, y0)].xyz;
  let d10 = dyeSrc[idx_at(x1, y0)].xyz;
  let d01 = dyeSrc[idx_at(x0, y1)].xyz;
  let d11 = dyeSrc[idx_at(x1, y1)].xyz;
  let dx0 = mix(d00, d10, frac.x);
  let dx1 = mix(d01, d11, frac.x);
  return mix(dx0, dx1, frac.y);
}

@compute @workgroup_size(${WORKGROUP_SIZE}, ${WORKGROUP_SIZE})
fn main(@builtin(global_invocation_id) gid: vec3<u32>) {
  let width = u32(u.grid.x);
  let height = u32(u.grid.y);
  if (gid.x >= width || gid.y >= height) {
    return;
  }

  let uv = (vec2<f32>(gid.xy) + 0.5) * u.grid.zw;
  let vel = sample_vel(uv);
  let prevUv = clamp(uv - vel * u.sim.x, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5);
  var dye = sample_dye(prevUv) * 0.992;

  let delta = uv - u.mouse.xy;
  let dist = length(delta);
  let falloff = smoothstep(u.mouse.w * 0.85, 0.0, dist) * u.mouse.z;
  let tint = 0.5 + 0.5 * cos(
    vec3<f32>(0.0, 2.1, 4.2)
    + vec3<f32>(
      u.sim.y * 0.28 + uv.x * 8.0,
      u.sim.y * 0.23 + uv.y * 7.0,
      u.sim.y * 0.19 + (uv.x + uv.y) * 5.0
    )
  );
  dye += tint * (falloff * 0.036);

const RENDER_WGSL = `
${SHARED_HELPERS}
struct VSOut {
  @builtin(position) position: vec4<f32>,
  @location(0) uv: vec2<f32>,
}

@group(0) @binding(0) var<uniform> u: Params;
@group(0) @binding(1) var<storage, read> dyeBuf: array<vec4<f32>>;
@group(0) @binding(2) var<storage, read> velBuf: array<vec4<f32>>;
@group(0) @binding(3) var<storage, read> divCurl: array<vec4<f32>>;

fn sample_dye_nearest(uv: vec2<f32>) -> vec3<f32> {
  let gridPos = uv_to_grid(clamp(uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let x = i32(round(gridPos.x));
  let y = i32(round(gridPos.y));
  return dyeBuf[idx_at(x, y)].xyz;
}

fn sample_vel_nearest(uv: vec2<f32>) -> vec2<f32> {
  let gridPos = uv_to_grid(clamp(uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let x = i32(round(gridPos.x));
  let y = i32(round(gridPos.y));
  return velBuf[idx_at(x, y)].xy;
}

fn sample_curl_nearest(uv: vec2<f32>) -> f32 {
  let gridPos = uv_to_grid(clamp(uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let x = i32(round(gridPos.x));
  let y = i32(round(gridPos.y));
  return divCurl[idx_at(x, y)].y;
}

fn dye_at(x: i32, y: i32) -> vec3<f32> {
  return dyeBuf[idx_at(x, y)].xyz;
}

fn vel_at(x: i32, y: i32) -> vec2<f32> {
  return velBuf[idx_at(x, y)].xy;
}

fn curl_at(x: i32, y: i32) -> f32 {
  return divCurl[idx_at(x, y)].y;
}

fn scalar_height(x: i32, y: i32) -> f32 {
  let uv = (vec2<f32>(f32(x), f32(y)) + 0.5) * u.grid.zw;
  let dye = dye_at(x, y);
  let vel = vel_at(x, y);
  let curl = curl_at(x, y);
  return clamp(length(dye) * 0.64 + abs(curl) * 0.016 + length(vel) * 0.10, 0.0, 1.3);
}

fn spectral(t: f32) -> vec3<f32> {
  return 0.5 + 0.5 * cos(vec3<f32>(0.0, 2.0, 4.0) + t * 6.28318);
}

@vertex
fn vs(@builtin(vertex_index) vertexIndex: u32) -> VSOut {
  var positions = array<vec2<f32>, 3>(
    vec2<f32>(-1.0, -3.0),
    vec2<f32>(-1.0,  1.0),
    vec2<f32>( 3.0,  1.0)
  );
  let pos = positions[vertexIndex];
  var out: VSOut;
  out.position = vec4<f32>(pos, 0.0, 1.0);
  out.uv = pos * 0.5 + vec2<f32>(0.5, 0.5);
  return out;
}

@fragment
fn fs(in: VSOut) -> @location(0) vec4<f32> {
  let gridPos = uv_to_grid(clamp(in.uv, u.grid.zw * 0.5, vec2<f32>(1.0) - u.grid.zw * 0.5));
  let gx = i32(round(gridPos.x));
  let gy = i32(round(gridPos.y));
  let dye = dye_at(gx, gy);
  let vel = vel_at(gx, gy);
  let curl = curl_at(gx, gy);
  let speed = length(vel);
  let hc = scalar_height(gx, gy);
  let hl = scalar_height(gx - 1, gy);
  let hr = scalar_height(gx + 1, gy);
  let hb = scalar_height(gx, gy - 1);
  let ht = scalar_height(gx, gy + 1);
  let grad = vec2<f32>(hr - hl, ht - hb) * 0.5;
  let normal = normalize(vec3<f32>(-grad.x * 1.25, -grad.y * 1.25, 1.0));
  let view = normalize(vec3<f32>(0.0, 0.0, 1.0));
  let fresnel = pow(1.0 - max(dot(normal, view), 0.0), 3.0);
  let prism = spectral(hc * 0.22 + abs(curl) * 0.36 + u.sim.y * 0.020);
  let secondary = spectral(speed * 0.30 + normal.x * 0.15 - normal.y * 0.08);
  let glint = pow(max(dot(reflect(normalize(vec3<f32>(0.20, -0.16, -1.0)), normal), view), 0.0), 20.0);
  let fluidGlow = dye * (0.92 + speed * 0.24) + prism * abs(curl) * 0.030;
  let metallic = mix(vec3<f32>(0.05, 0.06, 0.08), prism, 0.52)
    + secondary * fresnel * 0.22
    + vec3<f32>(1.0, 0.96, 0.93) * glint * 0.34;
  let base = fluidGlow + metallic * (0.22 + hc * 0.14);
  let vignette = 1.0 - smoothstep(0.15, 0.92, length(in.uv * 2.0 - 1.0));
  let bg = vec3<f32>(0.018, 0.024, 0.030) + vignette * vec3<f32>(0.020, 0.032, 0.040);
  return vec4<f32>(max(base, bg), 1.0);
}
`;

(async () => {
  const statusEl = document.getElementById('status');
  const adapterEl = document.getElementById('adapter');
  const frameEl = document.getElementById('frame');
  const graphCanvas = document.getElementById('fps-graph');
  const loadEl = document.getElementById('load');
  const pauseButton = document.getElementById('pause');
  const failureEl = document.getElementById('failure');
  const gridSelect = document.getElementById('grid-select');
  const pressureSelect = document.getElementById('pressure-select');
  const restartButton = document.getElementById('restart');
  const canvas = document.getElementById('view');
  const graphCtx = graphCanvas.getContext('2d');
  const fpsHistory = [];

  let device = null;
  let adapter = null;
  let context = null;
  let canvasConfigured = false;
  let format = null;
  let uniformBuffer = null;
  let currentGrid = parseInt(gridSelect.value, 10);
  let pressureIterations = parseInt(pressureSelect.value, 10);
  let running = false;
  let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let redrawRequested = true;
  let pausedSince = performance.now();
  let pausedMs = 0;
  let simulationTime = pausedSince;
  let lastFrameTime = performance.now();
  const uniformData = new Float32Array(16);

  let velocityBuffers = [];
  let dyeBuffers = [];
  let pressureBuffers = [];
  let divCurlBuffer = null;
  let currentDyeIndex = 0;

  let advectVelPipeline = null;
  let divCurlPipeline = null;
  let pressurePipeline = null;
  let projectPipeline = null;
  let advectDyePipeline = null;
  let renderPipeline = null;

  let advectVelBindGroup = null;
  let divCurlBindGroup = null;
  let pressureBindGroups = [];
  let projectBindGroup = null;
  let advectDyeBindGroups = [];
  let renderBindGroups = [];

  const pointer = { x: 0.5, y: 0.5, hover: false, down: false, dx: 0.0, dy: 0.0 };
  const simGrid = () => Math.max(96, Math.floor(currentGrid * SIM_DENSITY_SCALE));

  function resizeGraphCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(graphCanvas.clientWidth * dpr));
    const height = Math.max(1, Math.floor(graphCanvas.clientHeight * dpr));
    if (graphCanvas.width === width && graphCanvas.height === height) return;
    graphCanvas.width = width;
    graphCanvas.height = height;
  }

  function drawFpsGraph() {
    resizeGraphCanvas();
    const width = graphCanvas.width;
    const height = graphCanvas.height;
    graphCtx.clearRect(0, 0, width, height);
    graphCtx.fillStyle = '#080d16';
    graphCtx.fillRect(0, 0, width, height);
    if (fpsHistory.length < 2) return;

    const minFps = Math.max(0, Math.min(...fpsHistory) * 0.96);
    const maxFps = Math.max(minFps + 1, Math.max(...fpsHistory) * 1.04);
    const range = maxFps - minFps;

    graphCtx.beginPath();
    fpsHistory.forEach((fps, index) => {
      const x = fpsHistory.length === 1 ? 0 : (index / (fpsHistory.length - 1)) * width;
      const y = height - 1 - ((fps - minFps) / range) * Math.max(1, height - 2);
      if (index === 0) {
        graphCtx.moveTo(x, y);
      } else {
        graphCtx.lineTo(x, y);
      }
    });
    graphCtx.lineJoin = 'round';
    graphCtx.lineCap = 'round';
    graphCtx.lineWidth = Math.max(1.5, (window.devicePixelRatio || 1) * 1.1);
    graphCtx.strokeStyle = '#b8e0c9';
    graphCtx.stroke();
  }

  function recordFrameSample(dtMs) {
    fpsHistory.push(1000 / Math.max(dtMs, 0.001));
    if (fpsHistory.length > 120) fpsHistory.shift();
    drawFpsGraph();
  }

  function updateLoadLabel() {
    const effectiveGrid = simGrid();
    loadEl.textContent = `${currentGrid}² selected · ${effectiveGrid}² sim · ${pressureIterations} pressure iterations`;
  }

  function createBuffer(byteLength, usage) {
    return device.createBuffer({ size: byteLength, usage });
  }

  function resizeCanvas() {
    if (!context || !device || !format) return;
    const dpr = window.devicePixelRatio || 1;
    const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvasConfigured && canvas.width === width && canvas.height === height) return;
    canvas.width = width;
    canvas.height = height;
    context.configure({ device, format, alphaMode: 'opaque' });
    canvasConfigured = true;
    drawFpsGraph();
    redrawRequested = true;
    schedule();
  }

  async function requestAdapter() {
    const options = { powerPreference: 'high-performance' };
    for (let attempt = 0; attempt < 2; attempt += 1) {
      const candidate = await navigator.gpu.requestAdapter(options);
      if (candidate) return candidate;
      await new Promise((resolve) => setTimeout(resolve, 0));
    }
    return null;
  }

  function seedDye(grid) {
    const data = new Float32Array(grid * grid * 4);
    for (let y = 0; y < grid; y++) {
      for (let x = 0; x < grid; x++) {
        const i = (y * grid + x) * 4;
        const nx = x / grid - 0.5;
        const ny = y / grid - 0.5;
        const r = Math.sqrt(nx * nx + ny * ny);
        const ring = Math.max(0, 0.18 - Math.abs(r - 0.22));
        data[i + 0] = ring * 0.22;
        data[i + 1] = ring * 0.14;
        data[i + 2] = ring * 0.26;
        data[i + 3] = 1.0;
      }
    }
    return data;
  }

    resetMeter();
    const effectiveGrid = simGrid();
    [...velocityBuffers, ...dyeBuffers, ...pressureBuffers].forEach((buffer) => buffer.destroy());
    if (divCurlBuffer) divCurlBuffer.destroy();

    const byteLength = effectiveGrid * effectiveGrid * 16;
    velocityBuffers = [
      createBuffer(byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST),
      createBuffer(byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST),
    ];
    dyeBuffers = [
      createBuffer(byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST),
      createBuffer(byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST),
    ];

      createBuffer(effectiveGrid * effectiveGrid * 4, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST),
    ];
    divCurlBuffer = createBuffer(byteLength, GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST);

    const dye = seedDye(effectiveGrid);
    device.queue.writeBuffer(dyeBuffers[0], 0, dye);
    device.queue.writeBuffer(dyeBuffers[1], 0, dye);
    currentDyeIndex = 0;

    advectVelBindGroup = device.createBindGroup({
      layout: advectVelPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
        { binding: 1, resource: { buffer: velocityBuffers[0] } },
        { binding: 2, resource: { buffer: velocityBuffers[1] } },
      ],
    });
    divCurlBindGroup = device.createBindGroup({
      layout: divCurlPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
        { binding: 1, resource: { buffer: velocityBuffers[1] } },
        { binding: 2, resource: { buffer: divCurlBuffer } },
      ],
    });
    pressureBindGroups = [
      device.createBindGroup({
        layout: pressurePipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: pressureBuffers[0] } },
          { binding: 2, resource: { buffer: divCurlBuffer } },
          { binding: 3, resource: { buffer: pressureBuffers[1] } },
        ],
      }),
      device.createBindGroup({
        layout: pressurePipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: pressureBuffers[1] } },
          { binding: 2, resource: { buffer: divCurlBuffer } },
          { binding: 3, resource: { buffer: pressureBuffers[0] } },
        ],
      }),
    ];
    projectBindGroup = device.createBindGroup({
      layout: projectPipeline.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: { buffer: uniformBuffer } },
        { binding: 1, resource: { buffer: velocityBuffers[1] } },
        { binding: 2, resource: { buffer: pressureBuffers[0] } },
        { binding: 3, resource: { buffer: divCurlBuffer } },
        { binding: 4, resource: { buffer: velocityBuffers[0] } },
      ],
    });
    advectDyeBindGroups = [
      device.createBindGroup({
        layout: advectDyePipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: dyeBuffers[0] } },
          { binding: 2, resource: { buffer: velocityBuffers[0] } },
          { binding: 3, resource: { buffer: dyeBuffers[1] } },
        ],
      }),
      device.createBindGroup({
        layout: advectDyePipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: dyeBuffers[1] } },
          { binding: 2, resource: { buffer: velocityBuffers[0] } },
          { binding: 3, resource: { buffer: dyeBuffers[0] } },
        ],
      }),
    ];
    renderBindGroups = [
      device.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: dyeBuffers[0] } },
          { binding: 2, resource: { buffer: velocityBuffers[0] } },
          { binding: 3, resource: { buffer: divCurlBuffer } },
        ],
      }),
      device.createBindGroup({
        layout: renderPipeline.getBindGroupLayout(0),
        entries: [
          { binding: 0, resource: { buffer: uniformBuffer } },
          { binding: 1, resource: { buffer: dyeBuffers[1] } },
          { binding: 2, resource: { buffer: velocityBuffers[0] } },
          { binding: 3, resource: { buffer: divCurlBuffer } },
        ],
      }),
    ];

    updateLoadLabel();
    redrawRequested = true;
    schedule();
  }

  function updatePointer(event) {
    const rect = canvas.getBoundingClientRect();
    const nextX = rect.width > 0 ? (event.clientX - rect.left) / rect.width : 0.5;
    const nextY = rect.height > 0 ? 1.0 - (event.clientY - rect.top) / rect.height : 0.5;
    pointer.dx += nextX - pointer.x;
    pointer.dy += nextY - pointer.y;
    pointer.x = nextX;
    pointer.y = nextY;
  }

  async function init() {
    if (!navigator.gpu) throw new Error('WebGPU unavailable');
    adapter = await requestAdapter();
    if (!adapter) throw new Error('No adapter');
    device = await adapter.requestDevice();
    const activeDevice = device;
    device.lost.then((info) => {
      if (device !== activeDevice || !running) return;
      const detail = info.message || info.reason || 'unknown reason';
      fail(new Error(`WebGPU device lost: ${detail}`));
    });
    device.addEventListener('uncapturederror', event => fail(event.error));
    context = canvas.getContext('webgpu');
    if (!context) throw new Error('WebGPU canvas context unavailable');
    format = navigator.gpu.getPreferredCanvasFormat();

    uniformBuffer = device.createBuffer({
      size: 64,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });

    advectVelPipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: ADVECT_VEL_WGSL }), entryPoint: 'main' },
    });
    divCurlPipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: DIV_CURL_WGSL }), entryPoint: 'main' },
    });
    pressurePipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: PRESSURE_WGSL }), entryPoint: 'main' },
    });
    projectPipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: PROJECT_WGSL }), entryPoint: 'main' },
    });
    advectDyePipeline = device.createComputePipeline({
      layout: 'auto',
      compute: { module: device.createShaderModule({ code: ADVECT_DYE_WGSL }), entryPoint: 'main' },
    });
    const renderShader = device.createShaderModule({ code: RENDER_WGSL });
    renderPipeline = device.createRenderPipeline({
      layout: 'auto',
      vertex: { module: renderShader, entryPoint: 'vs' },
      fragment: { module: renderShader, entryPoint: 'fs', targets: [{ format }] },
      primitive: { topology: 'triangle-list' },
    });

    const info = adapter.info || {};
    const parts = [];
    if (info.vendor) parts.push(info.vendor);
    if (info.architecture) parts.push(info.architecture);
    if (info.device) parts.push(info.device);
    adapterEl.textContent = parts.join(' · ') || 'Adapter acquired';

    resizeCanvas();
    rebuildSimulationBuffers();
    statusEl.textContent = paused ? 'Paused' : 'WebGPU active';
    running = true;
  }

  const MAX_PENDING_FRAMES = 2;
  const METRIC_INTERVAL_MS = 500;
  let pendingFrames = 0;
  let raf = 0;
  let metricGeneration = 0;
  let lastCompletion = null;
  let measuredMs = 0;
  let measuredFrames = 0;

  function resetMeter() {
    metricGeneration += 1;
    lastCompletion = null;
    measuredMs = 0;
    measuredFrames = 0;
    fpsHistory.length = 0;
    frameEl.textContent = paused ? 'Paused' : '— fps · — ms';
    drawFpsGraph();
  }

  function schedule() {
    if (running && (!paused || redrawRequested) && !document.hidden
        && pendingFrames < MAX_PENDING_FRAMES && !raf) {
      raf = requestAnimationFrame(frame);
    }
  }

  async function frame(now) {
    raf = 0;
    if (!running || document.hidden || (paused && !redrawRequested)) return;
    const generation = metricGeneration;
    pendingFrames += 1;
    try {
      redrawRequested = false;
      render(now);
      schedule();
      await device.queue.onSubmittedWorkDone();
      if (running && !paused && !document.hidden && generation === metricGeneration) {
        const completed = performance.now();
        if (lastCompletion !== null) {
          measuredMs += completed - lastCompletion;
          measuredFrames += 1;
        }
        lastCompletion = completed;
        if (measuredMs >= METRIC_INTERVAL_MS) {
          const average = measuredMs / measuredFrames;
          frameEl.textContent = `${(1000 / average).toFixed(0)} fps · ${average.toFixed(1)} ms`;
          recordFrameSample(average);
          measuredMs = 0;
          measuredFrames = 0;
        }
      }
    } catch (error) {
      if (running) fail(error);
    } finally {
      pendingFrames -= 1;
      schedule();
    }
  }

  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    raf = 0;
    lastFrameTime = performance.now();
    resetMeter();
    schedule();
  });
  addEventListener('pagehide', () => {
    running = false;
    cancelAnimationFrame(raf);
    device?.destroy();
  });
  addEventListener('pageshow', event => { if (event.persisted) location.reload(); });

  function render(now) {
    const effectiveGrid = simGrid();
    const dtMs = Math.max(0, Math.min(33, now - lastFrameTime));
    lastFrameTime = now;
    const dt = dtMs / 1000;
    const mouseForce = pointer.hover ? (pointer.down ? 0.82 : 0.28) : 0.0;
    uniformData[0] = effectiveGrid;
    uniformData[1] = effectiveGrid;
    uniformData[2] = 1 / effectiveGrid;
    uniformData[3] = 1 / effectiveGrid;
    uniformData[4] = pointer.x;
    uniformData[5] = pointer.y;
    uniformData[6] = mouseForce;
    uniformData[7] = 0.10;
    uniformData[8] = dt * 0.82;
    if (!paused) simulationTime = now - pausedMs;
    uniformData[9] = simulationTime * 0.001;
    uniformData[10] = 2.0;
    uniformData[11] = 0.95;
    uniformData[12] = pointer.dx;
    uniformData[13] = pointer.dy;
    uniformData[14] = 0.0;
    uniformData[15] = 0.0;
    device.queue.writeBuffer(uniformBuffer, 0, uniformData);
    pointer.dx *= 0.72;
    pointer.dy *= 0.72;

    const encoder = device.createCommandEncoder();
    if (!paused) {
      const pass = encoder.beginComputePass();
      {
        pass.setPipeline(advectVelPipeline);
        pass.setBindGroup(0, advectVelBindGroup);
        pass.dispatchWorkgroups(Math.ceil(effectiveGrid / WORKGROUP_SIZE), Math.ceil(effectiveGrid / WORKGROUP_SIZE));
      }
      {
        pass.setPipeline(divCurlPipeline);
        pass.setBindGroup(0, divCurlBindGroup);
        pass.dispatchWorkgroups(Math.ceil(effectiveGrid / WORKGROUP_SIZE), Math.ceil(effectiveGrid / WORKGROUP_SIZE));
      }
      let pressureIndex = 0;
      for (let i = 0; i < pressureIterations; i++) {
        pass.setPipeline(pressurePipeline);
        pass.setBindGroup(0, pressureBindGroups[pressureIndex]);
        pass.dispatchWorkgroups(Math.ceil(effectiveGrid / WORKGROUP_SIZE), Math.ceil(effectiveGrid / WORKGROUP_SIZE));
        pressureIndex = 1 - pressureIndex;
      }
      {
        pass.setPipeline(projectPipeline);
        pass.setBindGroup(0, projectBindGroup);
        pass.dispatchWorkgroups(Math.ceil(effectiveGrid / WORKGROUP_SIZE), Math.ceil(effectiveGrid / WORKGROUP_SIZE));
      }
      {
        pass.setPipeline(advectDyePipeline);
        pass.setBindGroup(0, advectDyeBindGroups[currentDyeIndex]);
        pass.dispatchWorkgroups(Math.ceil(effectiveGrid / WORKGROUP_SIZE), Math.ceil(effectiveGrid / WORKGROUP_SIZE));
      }
      pass.end();
      currentDyeIndex = 1 - currentDyeIndex;
    }

    const renderPass = encoder.beginRenderPass({
      colorAttachments: [{
        view: context.getCurrentTexture().createView(),
        clearValue: { r: 0.02, g: 0.03, b: 0.028, a: 1.0 },
        loadOp: 'clear',
        storeOp: 'store',
      }],
    });
    renderPass.setPipeline(renderPipeline);
    renderPass.setBindGroup(0, renderBindGroups[currentDyeIndex]);
    renderPass.draw(3);
    renderPass.end();

    device.queue.submit([encoder.finish()]);

  }

  gridSelect.addEventListener('change', () => {
    currentGrid = parseInt(gridSelect.value, 10);
    rebuildSimulationBuffers();
  });
  pressureSelect.addEventListener('change', () => {
    pressureIterations = parseInt(pressureSelect.value, 10);
    updateLoadLabel();
  });
  function fail(error) {
    running = false;
    cancelAnimationFrame(raf);
    raf = 0;
    pauseButton.disabled = true;
    restartButton.disabled = true;
    gridSelect.disabled = true;
    pressureSelect.disabled = true;
    statusEl.textContent = `Error: ${error.message}`;
    failureEl.textContent = error.message;
    failureEl.hidden = false;
  }

  pauseButton.addEventListener('click', () => {
    const now = performance.now();
    paused = !paused;
    if (paused) {
      pausedSince = now;
      pointer.down = false;
      pointer.dx = 0;
      pointer.dy = 0;
    } else {
      pausedMs += now - pausedSince;
    }
    pauseButton.textContent = paused ? 'Resume' : 'Pause';
    pauseButton.setAttribute('aria-pressed', String(paused));
    statusEl.textContent = paused ? 'Paused' : 'WebGPU active';
    cancelAnimationFrame(raf);
    raf = 0;
    lastFrameTime = now;
    resetMeter();
    schedule();
  });
  restartButton.addEventListener('click', () => {
    pointer.dx = 0;
    pointer.dy = 0;
    rebuildSimulationBuffers();
  });
  canvas.addEventListener('pointerenter', () => { pointer.hover = true; });
  canvas.addEventListener('pointerleave', () => { pointer.hover = false; pointer.down = false; });
  canvas.addEventListener('pointermove', (event) => updatePointer(event));
  canvas.addEventListener('pointerdown', (event) => {
    updatePointer(event);
    pointer.down = true;
    pointer.hover = true;
    canvas.setPointerCapture(event.pointerId);
  });
  canvas.addEventListener('pointercancel', () => { pointer.down = false; pointer.hover = false; });
  addEventListener('pointerup', () => { pointer.down = false; });
  addEventListener('resize', () => resizeCanvas());

  try {
    await init();
    new ResizeObserver(resizeCanvas).observe(canvas);
    pauseButton.disabled = false;
    restartButton.disabled = false;
    gridSelect.disabled = false;
    pressureSelect.disabled = false;
    pauseButton.textContent = paused ? 'Resume' : 'Pause';
    pauseButton.setAttribute('aria-pressed', String(paused));
    drawFpsGraph();
    lastFrameTime = performance.now();
    schedule();
  } catch (error) {
    fail(error);
  }
})();

</script>
<script>
const demoSwitcher = document.querySelector('.demo-switcher');
document.addEventListener('pointerdown', event => {
  if (!demoSwitcher.contains(event.target)) demoSwitcher.open = false;
});
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && demoSwitcher.open) {
    demoSwitcher.open = false;
    demoSwitcher.querySelector('summary').focus();
  }
});
</script>
</body>
</html>
