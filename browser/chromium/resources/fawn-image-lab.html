<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Lab · Fawn</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; color: #eef7ee; background: #08110e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input { font: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid #c5f8d0; outline-offset: 3px; }
.shell { max-width: 1530px; min-height: 100vh; margin: auto; padding: 28px clamp(20px, 4vw, 64px) 42px; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
.back { color: #bdddc5; text-decoration: none; font-size: 13px; font-weight: 650; }
.back:hover { color: #fff; }
.status { display: flex; align-items: center; gap: 9px; color: #a7c1ae; font: 11px "SF Mono", Menlo, monospace; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #a4f1bc; box-shadow: 0 0 11px #a4f1bc; }
.title { margin: 58px 0 26px; }
.title p { margin: 0 0 10px; color: #a4d2ae; font-size: 11px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(48px, 7vw, 96px); line-height: .95; letter-spacing: -.075em; }
.workspace { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 265px; gap: 18px; align-items: stretch; }
.stage { position: relative; min-height: 500px; overflow: hidden; display: grid; place-items: center; border: 1px solid rgba(183, 225, 191, .25); border-radius: 22px; background: radial-gradient(ellipse at 55% 40%, #315364, #13242c 54%, #0b1719); }
#fallback, #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#fallback { object-fit: contain; }
#view { visibility: hidden; }
.stage::after { content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit; box-shadow: inset 0 0 100px rgba(0, 0, 0, .22); }
.stage-label { position: absolute; z-index: 1; left: 20px; bottom: 19px; padding: 9px 12px; border: 1px solid rgba(240, 255, 242, .25); border-radius: 9px; color: #fff; background: rgba(7, 17, 15, .64); backdrop-filter: blur(15px); font: 11px "SF Mono", Menlo, monospace; }
.panel { display: flex; flex-direction: column; gap: 26px; padding: 22px; border: 1px solid rgba(183, 225, 191, .2); border-radius: 22px; background: #101e19; }
.panel h2 { margin: 0 0 12px; color: #a5c4ae; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; }
.upload { display: block; padding: 16px; border: 1px solid rgba(194, 244, 204, .42); border-radius: 12px; cursor: pointer; text-align: center; font-size: 13px; font-weight: 700; background: #193628; transition: background .2s; }
.upload:hover { background: #24523a; }
.upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload:focus-within { outline: 2px solid #c5f8d0; outline-offset: 3px; }
.panel.disabled .upload, .panel button:disabled, .panel input[type="range"]:disabled { opacity: .5; cursor: not-allowed; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.modes button { padding: 11px 7px; border: 1px solid rgba(191, 227, 199, .19); border-radius: 9px; color: #bfd3c3; background: #142720; cursor: pointer; font-size: 12px; }
.modes button[aria-pressed="true"] { border-color: #a9edb8; color: #0d2719; background: #b9efc2; }
.control { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 9px; color: #d3e5d4; font-size: 12px; }
.control output { font-family: "SF Mono", Menlo, monospace; color: #a9d1b1; }
input[type="range"] { width: 100%; margin: 0; accent-color: #b7edc0; cursor: pointer; }
.panel-foot { margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(178, 221, 188, .15); color: #8da899; font: 11px/1.6 "SF Mono", Menlo, monospace; }
@media (max-width: 850px) { .workspace { grid-template-columns: 1fr; } .stage { min-height: 390px; } .panel { display: grid; grid-template-columns: 1fr 1fr; } .panel-foot { grid-column: 1/-1; } }
@media (max-width: 520px) { .title { margin-top: 42px; } .stage { min-height: 310px; } .panel { display: flex; } }
</style>
</head>
<body>
<div class="shell">
  <header class="top"><a class="back" href="./fawn-start.html">← Fawn</a><div class="status"><span class="dot" id="dot"></span><span id="status">Starting WebGPU</span></div></header>
  <div class="title"><p>WebGPU / Image</p><h1>Image Lab.</h1></div>
  <main class="workspace">
    <div class="stage"><canvas id="fallback" width="1024" height="768" aria-hidden="true"></canvas><canvas id="view" aria-label="Processed image"></canvas><span class="stage-label">ORIGINAL <span aria-hidden="true">← | →</span> EFFECT</span></div>
    <aside class="panel" aria-label="Image controls">
      <div><h2>Source</h2><label class="upload" for="file">Open an image <input id="file" type="file" accept="image/*"></label></div>
      <div><h2>Look</h2><div class="modes" id="modes"><button type="button" data-mode="0" aria-pressed="false">Original</button><button type="button" data-mode="1" aria-pressed="true">Glow</button><button type="button" data-mode="2" aria-pressed="false">Ink</button><button type="button" data-mode="3" aria-pressed="false">Mono</button></div></div>
      <div><div class="control"><label for="strength">Strength</label><output id="strength-value">70%</output></div><input id="strength" type="range" min="0" max="100" value="70"></div>
      <div><div class="control"><label for="split">Compare</label><output id="split-value">50%</output></div><input id="split" type="range" min="0" max="100" value="50"></div>
      <div class="panel-foot" id="image-info">Sample image · created locally</div>
    </aside>
  </main>
</div>
<script>
const SHADER = `
struct Params { controls: vec4<f32>, texel: vec4<f32>, }
@group(0) @binding(0) var source: texture_2d<f32>;
@group(0) @binding(1) var sourceSampler: sampler;
@group(0) @binding(2) var<uniform> params: Params;

@vertex
fn vs(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
  let x = f32(i32(i & 1u)) * 4.0 - 1.0;
  let y = f32(i32(i >> 1u)) * 4.0 - 1.0;
  return vec4<f32>(x, y, 0.0, 1.0);
}

fn luminance(c: vec3<f32>) -> f32 { return dot(c, vec3<f32>(0.2126, 0.7152, 0.0722)); }

@fragment
fn fs(@builtin(position) fc: vec4<f32>) -> @location(0) vec4<f32> {
  let pixel = fc.xy / params.texel.zw;
  let imageAspect = params.texel.y / params.texel.x;
  let viewAspect = params.texel.z / params.texel.w;
  var uv = pixel;
  if (viewAspect > imageAspect) {
    uv.x = (pixel.x - 0.5) * viewAspect / imageAspect + 0.5;
  } else {
    uv.y = (pixel.y - 0.5) * imageAspect / viewAspect + 0.5;
  }
  if (any(uv < vec2<f32>(0.0)) || any(uv > vec2<f32>(1.0))) { return vec4<f32>(0.04, 0.09, 0.08, 1.0); }
  let base = textureSampleLevel(source, sourceSampler, uv, 0.0).rgb;
  if (uv.x < params.controls.z || params.controls.x < 0.5) { return vec4<f32>(base, 1.0); }
  let amount = params.controls.y;
  var effect = base;
  if (params.controls.x < 1.5) {
    let dx = vec2<f32>(params.texel.x * 5.0, 0.0);
    let dy = vec2<f32>(0.0, params.texel.y * 5.0);
    let glow = (textureSampleLevel(source, sourceSampler, uv + dx, 0.0).rgb + textureSampleLevel(source, sourceSampler, uv - dx, 0.0).rgb + textureSampleLevel(source, sourceSampler, uv + dy, 0.0).rgb + textureSampleLevel(source, sourceSampler, uv - dy, 0.0).rgb) * 0.25;
    effect = min(vec3<f32>(1.0), base * vec3<f32>(1.04, 1.02, 0.98) + glow * luminance(glow) * 0.6);
  } else if (params.controls.x < 2.5) {
    let dx = vec2<f32>(params.texel.x * 2.0, 0.0);
    let dy = vec2<f32>(0.0, params.texel.y * 2.0);
    let edge = abs(luminance(textureSampleLevel(source, sourceSampler, uv + dx, 0.0).rgb) - luminance(textureSampleLevel(source, sourceSampler, uv - dx, 0.0).rgb)) + abs(luminance(textureSampleLevel(source, sourceSampler, uv + dy, 0.0).rgb) - luminance(textureSampleLevel(source, sourceSampler, uv - dy, 0.0).rgb));
    effect = vec3<f32>(1.0 - smoothstep(0.05, 0.35, edge));
  } else {
    let gray = luminance(base);
    effect = vec3<f32>(smoothstep(0.08, 0.92, gray));
  }
  let divider = 1.0 - smoothstep(0.0, 0.002, abs(uv.x - params.controls.z));
  return vec4<f32>(mix(mix(base, effect, vec3<f32>(amount)), vec3<f32>(0.85, 1.0, 0.86), vec3<f32>(divider * 0.75)), 1.0);
}
`;

function makeSample() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 768;
  const g = canvas.getContext('2d');
  const sky = g.createLinearGradient(0, 0, 0, 768);
  sky.addColorStop(0, '#131e46'); sky.addColorStop(.49, '#a66d83'); sky.addColorStop(1, '#f7b97e');
  g.fillStyle = sky; g.fillRect(0, 0, 1024, 768);
  const sun = g.createRadialGradient(670, 310, 25, 670, 310, 270);
  sun.addColorStop(0, '#fff7c9'); sun.addColorStop(.2, '#ffe3a3'); sun.addColorStop(.35, '#ffad91'); sun.addColorStop(1, '#ffad9100');
  g.fillStyle = sun; g.fillRect(0, 0, 1024, 768);
  g.fillStyle = '#ffe8bd'; g.beginPath(); g.arc(670, 310, 79, 0, Math.PI * 2); g.fill();
  function ridge(points, color) { g.fillStyle = color; g.beginPath(); g.moveTo(0, 768); for (const [x, y] of points) g.lineTo(x, y); g.lineTo(1024, 768); g.fill(); }
  ridge([[0, 465], [135, 322], [295, 468], [460, 358], [642, 505], [817, 371], [1024, 480]], '#354660');
  ridge([[0, 570], [180, 443], [390, 562], [565, 430], [760, 545], [935, 440], [1024, 495]], '#23384e');
  const water = g.createLinearGradient(0, 560, 0, 768);
  water.addColorStop(0, '#9a7890'); water.addColorStop(1, '#152c3d');
  g.fillStyle = water; g.fillRect(0, 560, 1024, 208);
  let seed = 62491;
  function random() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
  for (let i = 0; i < 230; i++) {
    const y = 565 + random() * 203;
    const spread = (y - 560) * 1.2;
    const x = 670 + (random() - .5) * spread;
    g.fillStyle = 'rgba(255,216,163,' + (.08 + random() * .35) + ')';
    g.fillRect(x, y, 1 + random() * (y - 550) * .36, 1 + random() * 2);
  }
  ridge([[0, 715], [160, 675], [350, 760], [590, 702], [820, 768]], '#101f29');
  return canvas;
}

(async () => {
  const view = document.getElementById('view');
  const fallback = document.getElementById('fallback');
  const status = document.getElementById('status');
  const dot = document.getElementById('dot');
  const info = document.getElementById('image-info');
  const strength = document.getElementById('strength');
  const split = document.getElementById('split');
  const buttons = [...document.querySelectorAll('[data-mode]')];
  let mode = 1, texture = null, bindGroup = null, source = makeSample(), device, context, pipeline, uniform, sampler, format;
  let uploadSerial = 0, gpuLost = false;
  fallback.getContext('2d').drawImage(source, 0, 0);

  function disableControls() {
    document.querySelector('.panel').classList.add('disabled');
    document.getElementById('file').disabled = true;
    strength.disabled = true; split.disabled = true;
    buttons.forEach(button => { button.disabled = true; });
  }

  function updateLabels() {
    document.getElementById('strength-value').textContent = strength.value + '%';
    document.getElementById('split-value').textContent = split.value + '%';
  }
  function render() {
    if (!bindGroup) return;
    const rect = view.getBoundingClientRect();
    const width = Math.max(1, Math.floor(rect.width * devicePixelRatio));
    const height = Math.max(1, Math.floor(rect.height * devicePixelRatio));
    if (view.width !== width || view.height !== height) {
      view.width = width; view.height = height;
      context.configure({ device, format, alphaMode: 'opaque' });
    }
    device.queue.writeBuffer(uniform, 0, new Float32Array([mode, Number(strength.value) / 100, Number(split.value) / 100, 0, 1 / source.width, 1 / source.height, width, height]));
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginRenderPass({ colorAttachments: [{ view: context.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
    pass.setPipeline(pipeline); pass.setBindGroup(0, bindGroup); pass.draw(3); pass.end();
    device.queue.submit([encoder.finish()]);
    view.style.visibility = 'visible';
  }
  function upload(nextSource) {
    const next = device.createTexture({ size: [nextSource.width, nextSource.height], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT });
    let nextBindGroup;
    try {
      device.queue.copyExternalImageToTexture({ source: nextSource }, { texture: next }, [nextSource.width, nextSource.height]);
      nextBindGroup = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: next.createView() }, { binding: 1, resource: sampler }, { binding: 2, resource: { buffer: uniform } }] });
    } catch (error) { next.destroy(); throw error; }
    if (texture) texture.destroy();
    texture = next; bindGroup = nextBindGroup; source = nextSource;
    info.textContent = source.width + ' × ' + source.height + ' · processed locally';
    fallback.width = source.width; fallback.height = source.height;
    fallback.getContext('2d').drawImage(source, 0, 0);
    render();
  }

  try {
    if (!navigator.gpu) throw new Error('WebGPU unavailable');
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error('No GPU adapter');
    device = await adapter.requestDevice();
    device.lost.then(reason => { gpuLost = true; dot.style.background = '#ef947d'; status.textContent = 'Device lost'; info.textContent = reason.message || 'Reload to reconnect'; bindGroup = null; view.style.visibility = 'hidden'; disableControls(); });
    context = view.getContext('webgpu');
    if (!context) throw new Error('Canvas unavailable');
    format = navigator.gpu.getPreferredCanvasFormat();
    const shader = device.createShaderModule({ code: SHADER });
    pipeline = device.createRenderPipeline({ layout: 'auto', vertex: { module: shader, entryPoint: 'vs' }, fragment: { module: shader, entryPoint: 'fs', targets: [{ format }] }, primitive: { topology: 'triangle-list' } });
    uniform = device.createBuffer({ size: 32, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });
    upload(source);
    status.textContent = 'WebGPU active';
    buttons.forEach(button => button.addEventListener('click', () => { mode = Number(button.dataset.mode); buttons.forEach(item => item.setAttribute('aria-pressed', String(item === button))); render(); }));
    [strength, split].forEach(input => input.addEventListener('input', () => { updateLabels(); render(); }));
    new ResizeObserver(render).observe(view);
    document.getElementById('file').addEventListener('change', async event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const serial = ++uploadSerial;
      try {
        const image = await createImageBitmap(file);
        if (serial !== uploadSerial || gpuLost) { image.close(); return; }
        const scale = Math.min(1, 2048 / Math.max(image.width, image.height));
        const next = document.createElement('canvas');
        next.width = Math.max(1, Math.round(image.width * scale)); next.height = Math.max(1, Math.round(image.height * scale));
        next.getContext('2d').drawImage(image, 0, 0, next.width, next.height);
        image.close(); upload(next);
      } catch (error) { status.textContent = 'Image error'; info.textContent = error.message; }
    });
  } catch (error) { dot.style.background = '#ef947d'; status.textContent = error.message; disableControls(); }
})();
</script>
</body>
</html>
