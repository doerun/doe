<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
<title id="title">Doe: technical architecture</title>
<desc id="desc">Nine components show native WebGPU objects branching into WGSL compilation, resource ownership, and command recording. Pipelines and bind groups converge in recorded work, then backend submission reaches the GPU. Completion returns callbacks and constrains resource retirement.</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.label{font-size:14px;font-weight:500;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style>
