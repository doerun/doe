<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
<title id="title">Doe compiles a program and binds its data for GPU execution</title>
<desc id="desc">WGSL enters the program lane and buffers enter the data lane. Within the selected device and backend, Doe prepares a program and binds resources. Both meet at a single GPU execution point and produce particle positions.</desc>
